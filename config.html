<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noai, noimageai">
  <title>AI Brief: Configure</title>
  <script src="https://res.cdn.office.net/teams-js/2.22.0/js/MicrosoftTeams.min.js"></script>
  <style>
    body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #f4f5f7; }
    .card { background: #fff; padding: 32px 40px; border-radius: 16px; border: 1px solid #e0e4e9; text-align: center; max-width: 360px; }
    h2 { font-size: 20px; margin: 0 0 8px; color: #1b2330; }
    p { font-size: 13px; color: #667080; margin: 0; }
  </style>
</head>
<body>
<div class="card">
  <h2>AI Brief</h2>
  <p>A daily briefing for people building AI agents, from The Median Canadian. Click Save to add this tab.</p>
</div>
<script>
  microsoftTeams.app.initialize().then(() => {
    microsoftTeams.pages.config.registerOnSaveHandler((saveEvent) => {
      microsoftTeams.pages.config.setConfig({
        suggestedDisplayName: "AI Brief",
        contentUrl: "https://ai.mediancanadian.ca/",
        websiteUrl: "https://ai.mediancanadian.ca/",
      });
      saveEvent.notifySuccess();
    });
    microsoftTeams.pages.config.setValidityState(true);
  });
</script>
</body>
</html>
